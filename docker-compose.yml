services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: siro-ai-backend
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: siro-ai-frontend
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend