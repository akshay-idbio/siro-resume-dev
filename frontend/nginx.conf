server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 300M;

    # React routes
    location / {
        try_files $uri /index.html;
    }

    # Main backend
    # Frontend calls: /api/upload-requirement
    # Backend receives: /upload-requirement
    location /api/ {
        proxy_pass http://backend-main:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Hybrid backend
    # Frontend calls: /hybrid-api/hybrid-start-bulk-analyze
    # Backend receives: /hybrid-start-bulk-analyze
    location /hybrid-api/ {
        proxy_pass http://backend-hybrid:8007/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Low-cost backend
    # Frontend calls: /lowcost-api/...
    # Backend receives: /...
    location /lowcost-api/ {
        proxy_pass http://backend-lowcost:8008/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
    }

    # CEO backend
    # If CEO and low-cost both run on same backend 8008
    location /ceo-api/ {
        proxy_pass http://backend-lowcost:8008/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 900s;
        proxy_connect_timeout 900s;
        proxy_send_timeout 900s;
    }
}