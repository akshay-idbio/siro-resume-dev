server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Limit applies to each batch request, not the whole job.
    # 25 resumes are uploaded per request.
    client_max_body_size 200M;

    client_body_timeout 600s;
    send_timeout 600s;

    # =====================================================
    # MAIN AI BACKEND
    # config.js: API_BASE_URL = "/api"
    # =====================================================
    location /api/ {
        proxy_pass http://host.docker.internal:8000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_request_buffering off;
        proxy_buffering off;
    }

    # =====================================================
    # HYBRID BACKEND
    # config.js: HYBRID_API_BASE_URL = "/hybrid-api"
    # =====================================================
    location /hybrid-api/ {
        proxy_pass http://backend-hybrid:8007/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_request_buffering off;
        proxy_buffering off;
    }

    # =====================================================
    # LOW-COST BACKEND
    # config.js: LOWCOST_API_BASE_URL = "/lowcost-api"
    # =====================================================
    location /lowcost-api/ {
        proxy_pass http://backend-lowcost:8008/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_request_buffering off;
        proxy_buffering off;
    }

    # React frontend routing must remain last.
    location / {
        try_files $uri $uri/ /index.html;
    }
}